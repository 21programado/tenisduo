<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenis 2v2 TV</title>
<script src="/static/socket.io.min.js"></script>
<style>
  :root { --j1:#2bb8ff; --j2:#ff5d5d; --ok:#3ddc97; --bg:#080b10; --panel:#121823; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; overflow:hidden; background:var(--bg); color:#e8edf5;
         font-family: Bahnschrift, "Segoe UI", system-ui, sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
  #hud { width:min(92vw, calc((100vh - 190px) * 1.5)); display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; }
  .card { display:flex; align-items:baseline; gap:12px; padding:6px 18px; background:var(--panel); border-radius:12px; border-bottom:4px solid; }
  .card.j1 { border-color:var(--j1); justify-self:start; color:var(--j1); }
  .card.j2 { border-color:var(--j2); justify-self:end; flex-direction:row-reverse; color:var(--j2); }
  .card small { font-size:15px; color:#9aa7b8; }
  .card b { font-size:clamp(40px, 7vh, 72px); line-height:1; font-variant-numeric:tabular-nums; transition:transform .15s; }
  .card b.sube { transform:scale(1.35); }
  #estado { font-size:clamp(14px, 2.2vh, 20px); text-align:center; color:var(--ok); min-width:0; }
  canvas { width:min(92vw, calc((100vh - 190px) * 1.5)); aspect-ratio:3/2; background:#0c121b; border-radius:10px; box-shadow:0 0 0 2px #1d2735, 0 20px 50px rgba(0,0,0,.6); }
  #barra { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  button { padding:8px 16px; font:inherit; font-size:15px; font-weight:600; border:0; border-radius:8px; cursor:pointer; background:#1b2533; color:#e8edf5; }
  button:hover { background:#27344a; }
  button:focus-visible { outline:3px solid var(--ok); outline-offset:2px; }
  button.on { background:var(--ok); color:#06210f; }
  #btn-revancha { display:none; background:var(--ok); color:#06210f; }
</style>
</head>
<body>
<div id="hud">
  <div class="card j1"><small>Equipo azul</small><b id="s1">0</b></div>
  <div id="estado">Esperando jugadores (0/4)</div>
  <div class="card j2"><small>Equipo rojo</small><b id="s2">0</b></div>
</div>
<canvas id="cancha" width="1200" height="800"></canvas>
<div id="barra">
  <button id="btn-audio" class="on">Sonido: sí (M)</button>
  <button data-v="normal">Normal</button><button data-v="rapido">Rápido</button>
  <button id="btn-pausa">Pausa (P)</button>
  <button id="btn-revancha">Revancha (R)</button>
  <button id="btn-full">Pantalla completa (F)</button>
</div>

<script>
const socket = io({ query: { tipo: "tv" } });
const $ = (id) => document.getElementById(id);
const cv = $("cancha"), ctx = cv.getContext("2d");
const C1 = "#2bb8ff", C2 = "#ff5d5d", BOLA = "#e4f01c";  // amarillo tenis
const COLOR_ROL = { 1: C1, 2: C1, 3: C2, 4: C2 };
const PALETA_H = 80;
let E = null, urlMando = "", estela = [], shake = 0, flash = null, flashT = 0, ultimo = { p1: 0, p2: 0 };

// ---------- Sonido (Web Audio, sin archivos) ----------
let audio = null, sonido = true;
function iniciarAudio() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === "suspended") audio.resume();
}
["click", "keydown", "touchstart"].forEach((ev) => document.addEventListener(ev, iniciarAudio));
function tono(f, dur, tipo = "square", delay = 0, vol = 0.12, hasta = null) {
  if (!sonido || !audio) return;
  const t = audio.currentTime + delay, o = audio.createOscillator(), g = audio.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f, t);
  if (hasta) o.frequency.exponentialRampToValueAtTime(hasta, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur);
}
socket.on("sonido", (d) => {
  if (d.tipo === "paleta") { tono(380 + Math.min(d.racha, 14) * 28, 0.08, "square"); shake = 4; }   // más agudo cuanto más larga la jugada
  else if (d.tipo === "pared") { tono(230, 0.06, "triangle"); shake = 2; }
  else if (d.tipo === "gol") { tono(300, 0.35, "sawtooth", 0, 0.14, 90); shake = 10; }
  else if (d.tipo === "cuenta") tono(440, 0.1, "sine", 0, 0.15);
  else if (d.tipo === "saque") tono(880, 0.2, "sine", 0, 0.15);
  else if (d.tipo === "victoria") [440, 554, 659, 880].forEach((f, i) => tono(f, i === 3 ? 0.5 : 0.12, "square", i * 0.13));
});
function alternarSonido() {
  iniciarAudio(); sonido = !sonido;
  $("btn-audio").textContent = sonido ? "Sonido: sí (M)" : "Sonido: no (M)";
  $("btn-audio").classList.toggle("on", sonido);
  tono(520, 0.08);
}
$("btn-audio").onclick = alternarSonido;

// ---------- Controles ----------
const revancha = () => socket.emit("revancha");
$("btn-revancha").onclick = revancha;
const pausar = () => socket.emit("pausar");
$("btn-pausa").onclick = pausar;
$("btn-full").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
document.querySelectorAll("[data-v]").forEach((b) => (b.onclick = () => socket.emit("velocidad", { nivel: b.dataset.v })));
document.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "m") alternarSonido(); else if (k === "p") pausar(); else if (k === "r") revancha(); else if (k === "f") $("btn-full").click();
});

// ---------- Eventos del servidor ----------
socket.on("info", (d) => (urlMando = d.url));
socket.on("estado_sala", (d) => { $("estado").textContent = d.msg; $("estado").style.color = "var(--ok)"; });
socket.on("actualizar_tv", (e) => {
  E = e;
  document.querySelectorAll("[data-v]").forEach((b) => b.classList.toggle("on", b.dataset.v === e.velocidad));
  const bp = $("btn-pausa"), t = e.pausado ? "Reanudar (P)" : "Pausa (P)";
  if (bp.textContent !== t) bp.textContent = t;
  bp.classList.toggle("on", !!e.pausado);
});
socket.on("marcador", (m) => {
  [["s1", m.p1, "p1", C1], ["s2", m.p2, "p2", C2]].forEach(([id, v, k, col]) => {
    const el = $(id);
    if (v > ultimo[k]) {
      el.classList.add("sube"); setTimeout(() => el.classList.remove("sube"), 180);
      flash = col; flashT = 1;
    }
    ultimo[k] = v; el.textContent = v;
  });
  if (m.ganador) {
    $("estado").textContent = `¡Ganó el equipo ${m.ganador === 1 ? "azul" : "rojo"}!`;
    $("estado").style.color = m.ganador === 1 ? C1 : C2;
  }
  $("btn-revancha").style.display = m.ganador ? "inline-block" : "none";
});

// ---------- Dibujo (60 fps, independiente de los mensajes) ----------
function texto(t, x, y, size, color, alpha = 1) {
  ctx.globalAlpha = alpha; ctx.fillStyle = color;
  ctx.font = `700 ${size}px Bahnschrift, "Segoe UI", system-ui, sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(t, x, y); ctx.globalAlpha = 1;
}
function paleta(cx, top, color) {
  ctx.shadowColor = color; ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(cx - 6, top, 12, PALETA_H, 5); ctx.fill();
}
function estadoRoles(x, roles, y0, listaListos) {
  roles.forEach((r, i) => {
    const marca = listaListos ? (E.listos.includes(r) ? "✓ listo" : "…") : (E.conectados.includes(r) ? "● conectado" : "○ libre");
    texto(`${E.nombres[r]}: ${marca}`, x, y0 + i * 30, 17, COLOR_ROL[r]);
  });
}
function dibujar() {
  requestAnimationFrame(dibujar);
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  ctx.clearRect(0, 0, 600, 400);
  if (!E) return;

  ctx.save();
  if (shake > 0.3) { ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake *= 0.82; }
  if (flashT > 0) { ctx.globalAlpha = flashT * 0.22; ctx.fillStyle = flash; ctx.fillRect(-10, -10, 620, 420); ctx.globalAlpha = 1; flashT -= 0.04; }

  texto(E.puntos_p1, 150, 200, 150, C1, 0.07);
  texto(E.puntos_p2, 450, 200, 150, C2, 0.07);

  ctx.setLineDash([8, 10]); ctx.strokeStyle = "#233044"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(300, 8); ctx.lineTo(300, 392); ctx.stroke(); ctx.setLineDash([]);
  if (E.modo === "zonas") {  // marca la división entre el jugador de arriba y el de abajo
    ctx.strokeStyle = "#233044";
    ctx.beginPath(); ctx.moveTo(8, 200); ctx.lineTo(44, 200); ctx.moveTo(556, 200); ctx.lineTo(592, 200); ctx.stroke();
  }

  ctx.shadowBlur = 14;
  paleta(E.x1, E.y1, C1); paleta(E.x2, E.y2, C1);
  paleta(E.x3, E.y3, C2); paleta(E.x4, E.y4, C2);
  ctx.shadowBlur = 0;

  const enJuego = E.jugando && E.pausa === 0;
  if (enJuego) { estela.push([E.bola_x, E.bola_y]); if (estela.length > 14) estela.shift(); } else estela = [];
  estela.forEach(([x, y], i) => { ctx.globalAlpha = (i / estela.length) * 0.3; ctx.fillStyle = BOLA; ctx.beginPath(); ctx.arc(x, y, 8 * (i / estela.length), 0, 7); ctx.fill(); });
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 16; ctx.shadowColor = BOLA; ctx.fillStyle = BOLA;
  ctx.beginPath(); ctx.arc(E.bola_x, E.bola_y, 8, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = "rgba(255,255,255,.75)"; ctx.lineWidth = 1.2;  // costura de pelota de tenis
  ctx.beginPath(); ctx.arc(E.bola_x - 7, E.bola_y, 7, -0.9, 0.9); ctx.stroke();
  ctx.beginPath(); ctx.arc(E.bola_x + 7, E.bola_y, 7, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();

  if (E.jugando && E.pausa > 0 && !E.pausado) texto(Math.ceil(E.pausa), 300, 110, 80, "#fff", Math.min(1, E.pausa % 1 + 0.3));
  if (!E.jugando && !E.ganador && E.completa) {
    texto("¡Preparados!", 300, 130, 34, "#e8edf5");
    texto("Cada jugador toca «Estoy listo» en su celular", 300, 170, 15, "#9aa7b8");
    estadoRoles(185, [1, 2], 230, true);
    estadoRoles(415, [3, 4], 230, true);
  } else if (!E.jugando && !E.ganador) {
    texto("Esperando jugadores", 300, 120, 26, "#e8edf5");
    texto("Entrá desde el celular a", 300, 160, 15, "#9aa7b8");
    texto(urlMando, 300, 187, 22, "#3ddc97");
    estadoRoles(185, [1, 2], 240, false);
    estadoRoles(415, [3, 4], 240, false);
  }
  if (E.ganador) {
    ctx.fillStyle = "rgba(8,11,16,.72)"; ctx.fillRect(0, 0, 600, 400);
    texto(`Ganó el equipo ${E.ganador === 1 ? "azul" : "rojo"}`, 300, 180, 40, E.ganador === 1 ? C1 : C2);
    texto(`${E.puntos_p1} – ${E.puntos_p2}`, 300, 235, 26, "#e8edf5");
    if (E.listos.length) texto(`Listos para la revancha: ${E.listos.length}/4`, 300, 280, 15, "#9aa7b8");
  }
  if (E.pausado) {
    ctx.fillStyle = "rgba(8,11,16,.72)"; ctx.fillRect(0, 0, 600, 400);
    texto("PAUSA", 300, 185, 46, "#e8edf5");
    texto("Se reanuda desde un celular o con la tecla P", 300, 235, 15, "#9aa7b8");
  }
  ctx.restore();
}
dibujar();
</script>
</body>
</html>
